<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http://127.0.0.1:12393 http://localhost:12393 data: blob:; media-src 'self' http://127.0.0.1:12393 http://localhost:12393 data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:12393 ws://127.0.0.1:12393 http://localhost:12393 ws://localhost:12393; worker-src 'self' blob:;"

    <title>Moonlight</title>
    <style>
      /* 首帧关键重置：global.css 由 Vite 经 JS 注入，窗口首帧可能先于其绘制。
         此规则确保 chat textarea 在样式注入前也不显示原生边框/背景/聚焦环，
         避免与 .input-wrap 容器边框叠加成「双框」（2026-08-11 修复）。 */
      textarea.input-box {
        border: none;
        outline: none;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
