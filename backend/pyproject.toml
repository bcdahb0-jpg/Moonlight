[project]
name = "moonlight-backend"
version = "0.1.0"
description = "Moonlight 桌宠后端 — 基于 warashi(Open-LLM-VTuber fork, MIT) 改造集成"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "chardet>=5.2.0",
    "edge-tts>=7.0.0",
    "fastapi[standard]>=0.115.8",
    "groq>=0.13.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "loguru>=0.7.2",
    "mcp[cli]>=1.26.0,<2.0",
    "numpy>=1.26.4,<2",
    "onnxruntime>=1.20.1",
    "openai>=1.57.4",
    "pydub>=0.25.1",
    "pysbd>=0.3.4",
    "pyttsx3>=2.98",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "ruamel-yaml>=0.18.10",
    "scipy>=1.14.1",
    "sherpa-onnx>=1.10.39",
    "soundfile>=0.12.1",
    "tomli>=2.2.1",
    "tqdm>=4.67.1",
    "uvicorn[standard]>=0.33.0",
    "websocket-client>=1.8.0",
    "opencc>=1.1.0",
    "imageio-ffmpeg>=0.6.0",
    "py7zr>=1.1.3",
    "langgraph>=1.2.9,<1.3",
    "langchain>=1.3",
    "langchain-openai>=1.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0,<3.2",
    "jieba>=0.42.1",
    "duckduckgo-search>=8.1.1",
    "agent-client-protocol>=0.12.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
# 可选：本地重型引擎（torch 系），默认不安装可大幅减小体积
torch-engines = [
    "torch>=2.6.0",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
per-file-ignores = { "scripts/run_bilibili_live.py" = ["E402"] }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
